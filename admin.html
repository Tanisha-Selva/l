<!DOCTYPE html>
<html ng-app="adminApp">
<head>
    <title>Quiz Admin - CRUD</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <style>
        body { font-family:Arial; background:#f2f2f2; padding:30px; }
        .container { width:800px; margin:auto; background:white; padding:25px; border-radius:10px; }
        input { width:95%; padding:10px; margin:5px; }
        button { padding:8px 15px; margin:5px; cursor:pointer; }
        .question { border:1px solid #ccc; padding:15px; margin-top:15px; border-radius:8px; }
        h1 { text-align:center; }
        .error { color:red; }
    </style>
</head>
<body ng-controller="AdminController">
<div class="container">
    <h1>Quiz Question Management</h1>

    <h3>{{editMode ? "Edit Question" : "Add New Question"}}</h3>

    <form name="questionForm" ng-submit="saveQuestion()" novalidate>
        <input type="text" placeholder="Enter Question"
               ng-model="question.question" required>

        <input type="text" placeholder="Option 1"
               ng-model="question.options[0]" required>

        <input type="text" placeholder="Option 2"
               ng-model="question.options[1]" required>

        <input type="text" placeholder="Option 3"
               ng-model="question.options[2]" required>

        <input type="text" placeholder="Option 4"
               ng-model="question.options[3]" required>

        <input type="text" placeholder="Correct Answer"
               ng-model="question.answer" required>

        <p class="error" ng-if="questionForm.$submitted && questionForm.$invalid">
            Please fill all fields.
        </p>

        <button type="submit">
            {{editMode ? "Update Question" : "Add Question"}}
        </button>

        <button type="button" ng-if="editMode" ng-click="cancelEdit()">
            Cancel
        </button>
    </form>

    <hr>
    <h2>All Questions</h2>

    <div class="question" ng-repeat="q in questions">
        <h3>{{$index + 1}}. {{q.question}}</h3>
        <p><b>Options:</b> {{q.options.join(", ")}}</p>
        <p><b>Correct Answer:</b> {{q.answer}}</p>

        <button ng-click="editQuestion(q)">Edit</button>
        <button ng-click="deleteQuestion(q._id)">Delete</button>
    </div>

    <br>
    <a href="index.html">Go to Quiz</a>
</div>

<script>
var app = angular.module("adminApp", []);

app.controller("AdminController", function($scope, $http) {
    $scope.questions = [];
    $scope.editMode = false;

    $scope.question = {
        question: "",
        options: ["", "", "", ""],
        answer: ""
    };

    $scope.loadQuestions = function() {
        $http.get("http://localhost:5000/api/questions")
        .then(function(response) {
            $scope.questions = response.data;
        });
    };

    $scope.saveQuestion = function() {
        if ($scope.questionForm.$invalid) {
            return;
        }

        if ($scope.editMode) {
            $http.put(
                "http://localhost:5000/api/questions/" + $scope.question._id,
                $scope.question
            ).then(function() {
                alert("Question updated successfully");
                $scope.loadQuestions();
                $scope.clearForm();
            });
        } else {
            $http.post(
                "http://localhost:5000/api/questions",
                $scope.question
            ).then(function() {
                alert("Question added successfully");
                $scope.loadQuestions();
                $scope.clearForm();
            });
        }
    };

    $scope.editQuestion = function(q) {
        $scope.question = angular.copy(q);
        $scope.editMode = true;
    };

    $scope.deleteQuestion = function(id) {
        if (confirm("Are you sure you want to delete this question?")) {
            $http.delete(
                "http://localhost:5000/api/questions/" + id
            ).then(function() {
                alert("Question deleted successfully");
                $scope.loadQuestions();
            });
        }
    };

    $scope.clearForm = function() {
        $scope.question = {
            question: "",
            options: ["", "", "", ""],
            answer: ""
        };
        $scope.editMode = false;
        $scope.questionForm.$setPristine();
        $scope.questionForm.$setUntouched();
    };

    $scope.cancelEdit = function() {
        $scope.clearForm();
    };

    $scope.loadQuestions();
});
</script>
</body>
</html>
